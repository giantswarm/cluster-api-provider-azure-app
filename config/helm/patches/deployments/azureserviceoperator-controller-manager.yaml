apiVersion: apps/v1
kind: Deployment
metadata:
  name: azureserviceoperator-controller-manager
  namespace: capz-system
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  control-plane: controller-manager
              topologyKey: kubernetes.io/hostname
            weight: 10
      containers:
      - name: manager
        # NOTE: --crd-pattern is deliberately NOT set here. Listing args in a
        # strategic merge patch replaces the whole list, which would silently
        # drop any arg upstream adds. It is patched by index instead, in
        # patches/deployments/azureserviceoperator-crd-pattern.yaml.
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
      volumes:
      - name: cert
        secret:
          secretName: aso-webhook-service-cert
