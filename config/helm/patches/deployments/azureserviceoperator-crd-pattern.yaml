# Replaces ASO's --crd-pattern with a Helm value, so that installations can
# extend the set of ASO CRDs that get installed. This is the chart-level
# equivalent of the ADDITIONAL_ASO_CRDS variable CAPZ substitutes at
# `clusterctl init` time, which we do not go through.
#
# The `test` op pins the value we expect from upstream. If CAPZ changes it --
# newer versions populate it with the base CRD patterns that used to ship in
# config/aso/crds.yaml -- kustomize fails here instead of silently discarding
# the new value, and this patch has to be reconciled by hand.
- op: test
  path: /spec/template/spec/containers/0/args/6
  value: --crd-pattern=${ADDITIONAL_ASO_CRDS:= }
- op: replace
  path: /spec/template/spec/containers/0/args/6
  value: --crd-pattern={{ .Values.aso.crdPattern }}
