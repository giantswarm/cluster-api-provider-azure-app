apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: azureserviceoperator-controller-manager
  labels:
    app.kubernetes.io/name: azure-service-operator
    control-plane: controller-manager
    observability.giantswarm.io/tenant: giantswarm
spec:
  endpoints:
  - port: metrics
    path: /metrics
    scheme: https
    tlsConfig:
      ca:
        secret:
          name: aso-webhook-service-cert
          key: ca.crt
      serverName: capz-webhook-service.{{ .Release.Namespace }}.svc
    authorization:
      type: Bearer
      credentials:
        name: azureserviceoperator-controller-manager-scrape
        key: token
  selector:
    matchLabels:
      app.kubernetes.io/name: azure-service-operator
      control-plane: controller-manager
