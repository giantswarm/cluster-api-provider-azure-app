# -- Image settings.
image:
  # -- Image registry.
  registry: gsoci.azurecr.io
  # -- Image repository.
  name: giantswarm/cluster-api-azure-controller
  # -- Image tag. Defaults to the chart's app version.
  tag:

# -- Azure Service Operator settings.
aso:
  # -- Additional ASO CRDs to deploy, in `<group>/<Kind>` format (e.g. `storage.azure.com/StorageAccount`).
  # A wildcard is allowed in the Kind (e.g. `storage.azure.com/*`), but not in the group.
  #
  # These are added to the CRDs that are always deployed, which cannot be removed.
  # An entry that does not match any CRD in the deployed ASO version makes ASO fail to start.
  # Removing an entry neither uninstalls the CRD nor stops ASO from reconciling its resources;
  # delete the CRD manually if it is no longer needed.
  #
  # See the reference documentation for the available resources:
  # https://azure.github.io/azure-service-operator/reference/
  additionalCRDs: []

  # -- Image settings.
  image:
    # -- Image registry.
    registry: gsoci.azurecr.io
    # -- Image repository.
    name: giantswarm/azureserviceoperator

# -- Workload cluster settings.
workloadCluster:
  # -- SSH settings.
  ssh:
    # -- SSO public key.
    ssoPublicKey: ""

# -- Controller settings.
controller:
  # -- Log verbosity.
  verbosity: 0

# -- Vertical Pod Autoscaler settings.
verticalPodAutoscaler:
  # -- Whether to enable Vertical Pod Autoscaler or not.
  enabled: true

# -- Cilium Network Policy settings.
ciliumNetworkPolicy:
  # -- Whether to enable Cilium Network Policy or not.
  enabled: false

# -- Service Monitor settings.
serviceMonitor:
  # -- Whether to enable Service Monitor or not.
  enabled: true

# -- CRD install job settings.
crds:
  # -- Whether to install CRDs or not.
  install: true
