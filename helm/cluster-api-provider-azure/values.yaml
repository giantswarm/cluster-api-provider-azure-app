# -- Image settings.
image:
  # -- Image registry.
  registry: gsoci.azurecr.io
  # -- Image repository.
  name: giantswarm/cluster-api-azure-controller
  # -- Image tag. Defaults to the chart's app version.
  tag:

# -- Azure Service Operator settings.
aso:
  # -- Image settings.
  image:
    # -- Image registry.
    registry: gsoci.azurecr.io
    # -- Image repository.
    name: giantswarm/azureserviceoperator
  # -- Semicolon-delimited glob patterns of additional ASO CRDs to install on
  # startup, on top of the ones installed by the CRD install job. See
  # https://azure.github.io/azure-service-operator/guide/crd-management/.
  crdPattern: "insights.azure.com/DiagnosticSetting;eventhub.azure.com/*"

# -- Workload cluster settings.
workloadCluster:
  # -- SSH settings.
  ssh:
    # -- SSO public key.
    ssoPublicKey: ""

# -- Controller settings.
controller:
  # -- Log verbosity.
  verbosity: 0

# -- Vertical Pod Autoscaler settings.
verticalPodAutoscaler:
  # -- Whether to enable Vertical Pod Autoscaler or not.
  enabled: true

# -- Cilium Network Policy settings.
ciliumNetworkPolicy:
  # -- Whether to enable Cilium Network Policy or not.
  enabled: false

# -- Service Monitor settings.
serviceMonitor:
  # -- Whether to enable Service Monitor or not.
  enabled: true

# -- CRD install job settings.
crds:
  # -- Whether to install CRDs or not.
  install: true
