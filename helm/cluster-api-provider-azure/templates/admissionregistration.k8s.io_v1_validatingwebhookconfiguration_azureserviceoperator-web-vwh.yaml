apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: '{{ .Release.Namespace }}/azureserviceoperator-serving-cert'
  labels:
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
    app.kubernetes.io/name: cluster-api-provider-azure
    app.kubernetes.io/version: '{{ .Chart.AppVersion }}'
    application.giantswarm.io/team: '{{ index .Chart.Annotations "application.giantswarm.io/team"
      }}'
    helm.sh/chart: cluster-api-provider-azure
  name: azureserviceoperator-web-vwh
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /validate-web-azure-com-v1api20220301-serverfarm
  failurePolicy: Fail
  matchPolicy: Exact
  name: validate.v1api20220301.serverfarms.web.azure.com
  rules:
  - apiGroups:
    - web.azure.com
    apiVersions:
    - v1api20220301
    operations:
    - CREATE
    - UPDATE
    resources:
    - serverfarms
  sideEffects: None
