apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: '{{ .Release.Namespace }}/azureserviceoperator-serving-cert'
  labels:
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
    app.kubernetes.io/name: cluster-api-provider-azure
    app.kubernetes.io/version: '{{ .Chart.AppVersion }}'
    application.giantswarm.io/team: '{{ index .Chart.Annotations "application.giantswarm.io/team"
      }}'
    helm.sh/chart: cluster-api-provider-azure
  name: zzz-azureserviceoperator-authorization-mwh
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /mutate-authorization-azure-com-v1api20200801preview-roleassignment
  failurePolicy: Fail
  matchPolicy: Exact
  name: default.v1api20200801preview.roleassignments.authorization.azure.com
  rules:
  - apiGroups:
    - authorization.azure.com
    apiVersions:
    - v1api20200801preview
    operations:
    - CREATE
    - UPDATE
    resources:
    - roleassignments
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /mutate-authorization-azure-com-v1api20220401-roleassignment
  failurePolicy: Fail
  matchPolicy: Exact
  name: default.v1api20220401.roleassignments.authorization.azure.com
  rules:
  - apiGroups:
    - authorization.azure.com
    apiVersions:
    - v1api20220401
    operations:
    - CREATE
    - UPDATE
    resources:
    - roleassignments
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /mutate-authorization-azure-com-v1api20220401-roledefinition
  failurePolicy: Fail
  matchPolicy: Exact
  name: default.v1api20220401.roledefinitions.authorization.azure.com
  rules:
  - apiGroups:
    - authorization.azure.com
    apiVersions:
    - v1api20220401
    operations:
    - CREATE
    - UPDATE
    resources:
    - roledefinitions
  sideEffects: None
