apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: '{{ .Release.Namespace }}/azureserviceoperator-serving-cert'
  labels:
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
    app.kubernetes.io/name: cluster-api-provider-azure
    app.kubernetes.io/version: '{{ .Chart.AppVersion }}'
    application.giantswarm.io/team: '{{ index .Chart.Annotations "application.giantswarm.io/team"
      }}'
    helm.sh/chart: cluster-api-provider-azure
  name: zzz-azureserviceoperator-devices-mwh
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /mutate-devices-azure-com-v1api20210702-iothub
  failurePolicy: Fail
  matchPolicy: Exact
  name: default.v1api20210702.iothubs.devices.azure.com
  rules:
  - apiGroups:
    - devices.azure.com
    apiVersions:
    - v1api20210702
    operations:
    - CREATE
    - UPDATE
    resources:
    - iothubs
  sideEffects: None
