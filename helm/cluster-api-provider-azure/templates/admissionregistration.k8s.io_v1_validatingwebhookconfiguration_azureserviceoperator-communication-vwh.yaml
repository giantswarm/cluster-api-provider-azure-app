apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: '{{ .Release.Namespace }}/azureserviceoperator-serving-cert'
  labels:
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
    app.kubernetes.io/name: cluster-api-provider-azure
    app.kubernetes.io/version: '{{ .Chart.AppVersion }}'
    application.giantswarm.io/team: '{{ index .Chart.Annotations "application.giantswarm.io/team"
      }}'
    helm.sh/chart: cluster-api-provider-azure
  name: azureserviceoperator-communication-vwh
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /validate-communication-azure-com-v20230401-communicationservice
  failurePolicy: Fail
  matchPolicy: Exact
  name: validate.v20230401.communicationservices.communication.azure.com
  rules:
  - apiGroups:
    - communication.azure.com
    apiVersions:
    - v20230401
    operations:
    - CREATE
    - UPDATE
    resources:
    - communicationservices
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /validate-communication-azure-com-v20230401-domain
  failurePolicy: Fail
  matchPolicy: Exact
  name: validate.v20230401.domains.communication.azure.com
  rules:
  - apiGroups:
    - communication.azure.com
    apiVersions:
    - v20230401
    operations:
    - CREATE
    - UPDATE
    resources:
    - domains
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /validate-communication-azure-com-v20230401-emailservice
  failurePolicy: Fail
  matchPolicy: Exact
  name: validate.v20230401.emailservices.communication.azure.com
  rules:
  - apiGroups:
    - communication.azure.com
    apiVersions:
    - v20230401
    operations:
    - CREATE
    - UPDATE
    resources:
    - emailservices
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: azureserviceoperator-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /validate-communication-azure-com-v20230401-senderusername
  failurePolicy: Fail
  matchPolicy: Exact
  name: validate.v20230401.senderusernames.communication.azure.com
  rules:
  - apiGroups:
    - communication.azure.com
    apiVersions:
    - v20230401
    operations:
    - CREATE
    - UPDATE
    resources:
    - senderusernames
  sideEffects: None
