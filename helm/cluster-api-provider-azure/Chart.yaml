apiVersion: v2
name: cluster-api-provider-azure
description: A Helm chart for Cluster API Provider Azure components.
version: 4.4.0
# This refers to a release in the Giant Swarm fork. The fork closely follows upstream releases unless hotfixes are
# needed. Please read https://github.com/giantswarm/cluster-api-provider-azure/blob/main/README.md on how to create a
# release. Please include the short commit SHA in the tag name, such as `v1.22.0-gs-123abcd`. After changing this
# tag, please run `make generate` to update CRDs and other manifests.

# Changes in this tag include upstream v1.23.x with additional:
# * Giant Swarm README and GitHub Workflows (https://github.com/giantswarm/cluster-api-provider-azure/pull/129)
# * Add Private Link support (https://github.com/giantswarm/cluster-api-provider-azure/pull/130)
# * Fix RBAC for OwnerReferencesPermissionEnforcement feature (https://github.com/giantswarm/cluster-api-provider-azure/pull/131)
# * Add DiagnosticSetting and Event Hub CRDs to ASO_CRDS (https://github.com/giantswarm/cluster-api-provider-azure/pull/132)
# * Don't specify rules in aggregated cluster role (https://github.com/giantswarm/cluster-api-provider-azure/pull/133)
appVersion: v1.24.3-gs-0226b4d39
home: https://github.com/giantswarm/cluster-api-provider-azure-app
icon: https://s.giantswarm.io/app-icons/giantswarm/1/dark.svg
annotations:
  ui.giantswarm.io/logo: https://s.giantswarm.io/app-icons/giantswarm/1/dark.svg
  io.giantswarm.application.team: phoenix
